<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="6" opacity="0.4" stroke-dasharray="16 8"/>
  
  <!-- Shield outline -->
  <path d="M256 90 L390 145 C390 270 330 365 256 415 C182 365 122 270 122 145 Z" 
        fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="14" filter="url(#glow)"/>
        
  <!-- Center lock / checkmark emblem -->
  <!-- Checkmark -->
  <path d="M190 250 L235 295 L325 200" 
        fill="none" stroke="#10b981" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Lock shackle at top -->
  <path d="M226 185 C226 160 286 160 286 185" 
        fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
</svg>
